<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>AVO Short-Form Starter</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --sf-canvas: #070a12;
        --sf-ink: #f4f4f5;
        --sf-accent: #6366f1;
        --sf-muted: #94a3b8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--sf-canvas);
        color: var(--sf-ink);
        font-family: Inter, system-ui, sans-serif;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--sf-canvas);
      }
      .clip {
        position: absolute;
      }
      #ambient-bg {
        inset: 0;
        background: radial-gradient(ellipse at 50% 30%, #12182a 0%, var(--sf-canvas) 70%);
      }
      #vignette {
        inset: 0;
        pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 40%, rgba(0, 0, 0, 0.55) 100%);
        z-index: 20;
      }
      #face-wrapper {
        width: 1920px;
        height: 1080px;
        transform-origin: top left;
        left: 0;
        top: 0;
        z-index: 1;
      }
      #face-placeholder {
        width: 100%;
        height: 100%;
        background: linear-gradient(145deg, #1e293b 0%, #0f172a 100%);
        border: 2px dashed rgba(255, 255, 255, 0.15);
        display: grid;
        place-items: center;
        font-size: 24px;
        color: var(--sf-muted);
      }
      #seam-treatment {
        left: 0;
        top: 900px;
        width: 1080px;
        height: 120px;
        background: linear-gradient(to bottom, transparent, var(--sf-canvas));
        z-index: 5;
        pointer-events: none;
      }
      #scene-hook {
        left: 48px;
        top: 120px;
        width: 984px;
        padding: 32px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        z-index: 10;
      }
      #scene-hook h2 {
        margin: 0 0 8px;
        font-size: 44px;
      }
      #scene-hook p {
        margin: 0;
        color: var(--sf-muted);
        font-size: 22px;
      }
      #captions-stub {
        left: 48px;
        bottom: 180px;
        width: 984px;
        text-align: center;
        font-size: 48px;
        font-weight: 900;
        text-shadow: 0 2px 0 #000, 0 -2px 0 #000, 2px 0 0 #000, -2px 0 0 #000;
        z-index: 15;
      }
      #captions-stub .active {
        color: var(--sf-accent);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="20"
    >
      <div id="ambient-bg" class="clip" data-start="0" data-duration="20" data-track-index="3"></div>

      <div id="face-wrapper" class="clip" data-start="0" data-duration="20" data-track-index="0">
        <div id="face-placeholder">face placeholder — swap for &lt;video&gt;</div>
      </div>

      <div id="seam-treatment" class="clip" data-start="0" data-duration="8" data-track-index="5"></div>

      <div id="scene-hook" class="clip" data-start="2" data-duration="5" data-track-index="1">
        <h2 id="hook-title">Hook overlay</h2>
        <p id="hook-sub">Top-half scene while face is BOTTOM mode</p>
      </div>

      <div id="captions-stub" class="clip" data-start="0" data-duration="20" data-track-index="2">
        Word <span class="active">sync</span> stub
      </div>

      <div id="vignette" class="clip" data-start="0" data-duration="20" data-track-index="4"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const SLOT = 20;
      const BOTTOM = { x: 0, y: 1136, scale: 0.5625 };
      const FULLSCREEN = { x: -1166.5, y: 0, scale: 1.7778 };
      const MODE_DUR = 0.32;

      const tl = gsap.timeline({ paused: true });

      gsap.set("#face-wrapper", { ...BOTTOM });

      tl.from("#hook-title", { y: 32, opacity: 0, duration: 0.5, ease: "power3.out" }, 2.1);
      tl.from("#hook-sub", { y: 20, opacity: 0, duration: 0.4, ease: "power2.out" }, 2.35);
      tl.to("#scene-hook", { opacity: 0, duration: 0.35, ease: "power2.in" }, 6.5);

      tl.to("#face-wrapper", { ...FULLSCREEN, duration: MODE_DUR, ease: "expo.inOut" }, 7.85);

      tl.to({}, { duration: SLOT }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
