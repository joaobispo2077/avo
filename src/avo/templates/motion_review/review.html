<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; base-uri 'none'; form-action 'none'">
  <title>$title</title>
  <link rel="stylesheet" href="review.css">
</head>
<body>
  <main>
    <h1>$title</h1>
    <p>Map items and storyboard cards share stable labels. Concepts and sketches are planning evidence. Continuous motion and sound require their own current encoded review.</p>
    <nav aria-label="Chronological motion map"><h2>Motion map</h2><ol>$map_rows</ol></nav>
    <section aria-label="Linked storyboard"><h2>Storyboard cards</h2><div class="cards">$cards</div></section>
    <section><h2>Equivalent text, tracks and pending work</h2><pre class="motion-plan">$content</pre></section>
  </main>
</body>
</html>
