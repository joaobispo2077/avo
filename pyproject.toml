[project]
name = "avo"
version = "1.0.0-alpha.1"
description = "Local-first Python helpers for AVO — transcription, captions, grading, render, and telemetry on your machine."
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.2,<2",
    "librosa",
    "matplotlib",
    "pillow",
    "numpy",
    "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*", "*Tests", "*TestCase"]
python_functions = ["test_*"]
addopts = "-ra"
markers = [
    "slow: downloads models or heavy IO (orchestrator-smoke only)",
    "integration: crosses script/subprocess boundaries",
    "project: footage-project or spec-scoped edit tests (excluded from default CI)",
]
