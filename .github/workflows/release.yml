name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'

jobs:
  verify:
    name: Pre-release verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          npm ci

      - name: Gate 1
        run: bash scripts/validate-prerequisites.sh --ci

      - name: Gate 2
        run: bash scripts/validate-usability.sh --ci

      - name: Unit tests
        run: bash scripts/ci/run-unit-tests.sh

  version-check:
    name: Version alignment
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches manifests and CHANGELOG
        run: bash scripts/ci/verify-release-version.sh "${{ github.ref_name }}"

  github-release:
    name: GitHub Release
    needs: version-check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract release notes
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "body<<EOF"
            bash scripts/ci/extract-changelog-section.sh "$VERSION"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AVO ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
