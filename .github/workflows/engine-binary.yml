# Dedicated zip-smoke for the frozen engine. Do not add this freeze to default pytest CI.
name: Engine binary

on:
  push:
    branches:
      - 'feature/**'
    paths:
      - packaging/**
      - src/avo/engine_cli.py
      - src/avo/__main__.py
      - src/avo/paths.py
      - src/avo/transcribe.py
      - src/avo/cli.py
      - src/avo/motion.py
      - src/avo/adapters/motion/code_drawn.py
      - src/avo/templates/code_drawn/**
      - schemas/avo.code-drawn.schema.json
      - schemas/avo.motion.schema.json
      - pyproject.toml
      - uv.lock
      - scripts/ci/build-engine.sh
      - scripts/ci/build-engine.ps1
      - scripts/ci/engine-binary-smoke.sh
      - tests/fixtures/engine/**
      - .github/workflows/engine-binary.yml
  pull_request:
    paths:
      - packaging/**
      - src/avo/engine_cli.py
      - src/avo/__main__.py
      - src/avo/paths.py
      - src/avo/transcribe.py
      - src/avo/cli.py
      - src/avo/motion.py
      - src/avo/adapters/motion/code_drawn.py
      - src/avo/templates/code_drawn/**
      - schemas/avo.code-drawn.schema.json
      - schemas/avo.motion.schema.json
      - pyproject.toml
      - uv.lock
      - scripts/ci/build-engine.sh
      - scripts/ci/build-engine.ps1
      - scripts/ci/engine-binary-smoke.sh
      - tests/fixtures/engine/**
      - .github/workflows/engine-binary.yml
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      attach_tag:
        description: GitHub release tag to attach engine zips to (e.g. v1.11.0). Empty runs smoke only.
        required: false
        default: ''

concurrency:
  group: engine-binary-${{ github.event_name }}-${{ (github.event_name == 'release' || github.event_name == 'workflow_dispatch') && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' && github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '24'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  select-run:
    name: Select Engine work
    # Published tags may predate the selector; release builds stay independent.
    if: github.event_name != 'release' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_full_ci: ${{ steps.select.outputs.run_full_ci }}
      reason: ${{ steps.select.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select validation
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/select_ci_run.py --workflow engine-binary

  zip-smoke:
    name: Zip smoke (${{ matrix.platform }})
    needs: select-run
    if: ${{ !cancelled() && ((github.event_name == 'release' || github.event_name == 'workflow_dispatch') || (needs.select-run.result == 'success' && needs.select-run.outputs.run_full_ci == 'true')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: macos-14
            platform: macos-arm64
          - os: ubuntu-24.04
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/avo-code-drawn-browsers
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.attach_tag || github.sha }}
          fetch-tags: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Release tags may predate this optional runtime; preserve historical builds.
      - name: Detect code-drawn runtime
        id: code-drawn
        shell: python
        run: |
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          enabled = "code-drawn" in project["project"].get("optional-dependencies", {})
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"enabled={str(enabled).lower()}\n")

      - name: Install code-drawn capture dependencies
        if: steps.code-drawn.outputs.enabled == 'true'
        run: python -m pip install -e ".[code-drawn]"

      - name: Ensure FFmpeg and FFprobe (Linux)
        if: steps.code-drawn.outputs.enabled == 'true' && runner.os == 'Linux'
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version
          ffprobe -version

      - name: Ensure FFmpeg and FFprobe (macOS)
        if: steps.code-drawn.outputs.enabled == 'true' && runner.os == 'macOS'
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            brew install ffmpeg
          fi
          ffmpeg -version
          ffprobe -version

      - name: Ensure FFmpeg and FFprobe (Windows)
        if: steps.code-drawn.outputs.enabled == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue) -or
              -not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue) -or
              -not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            throw "FFmpeg and FFprobe must be available for the native capture smoke."
          }
          ffmpeg -version
          ffprobe -version

      # The extracted launcher installs its own fresh browser cache during smoke.
      - name: Install Chromium system dependencies (Linux)
        if: steps.code-drawn.outputs.enabled == 'true' && runner.os == 'Linux'
        timeout-minutes: 8
        run: python -m playwright install-deps chromium

      - name: Build engine zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/build-engine.ps1

      - name: Build engine zip (Unix)
        if: runner.os != 'Windows'
        run: bash scripts/ci/build-engine.sh

      - name: Upload engine zip
        uses: actions/upload-artifact@v7
        with:
          name: engine-zip-${{ matrix.platform }}
          path: dist/engine/avo-*-${{ matrix.platform }}.zip
          if-no-files-found: error
          retention-days: 7

      - name: Smoke unpacked zip
        shell: bash
        env:
          AVO_ENGINE_PLATFORM: ${{ matrix.platform }}
          AVO_REQUIRE_CODE_DRAWN_RUNTIME: ${{ steps.code-drawn.outputs.enabled == 'true' && '1' || '0' }}
          AVO_CI_TRANSCRIBE_STUB: '1'
        run: bash scripts/ci/engine-binary-smoke.sh

  publish-release:
    name: Upload engine zips to GitHub Release
    # The selector is skipped on release runs; still require every zip to pass.
    if: >
      !cancelled() &&
      needs.zip-smoke.result == 'success' &&
      (github.event_name == 'release' ||
       (github.event_name == 'workflow_dispatch' && inputs.attach_tag != ''))
    needs: zip-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
      GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
    steps:
      - name: Download engine zips
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          pattern: engine-zip-*
          merge-multiple: true

      - name: SHA256SUMS and gh release upload
        env:
          TAG: ${{ github.event.release.tag_name || inputs.attach_tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          mkdir -p release-assets
          missing=0
          for slug in windows-x64 macos-arm64 linux-x64; do
            name="avo-${VERSION}-${slug}.zip"
            found="$(find artifacts -name "$name" -print | head -n 1)"
            if [ -z "$found" ]; then
              echo "error: missing $name" >&2
              missing=1
              continue
            fi
            cp "$found" "release-assets/$name"
          done
          if [ "$missing" -ne 0 ]; then
            find artifacts -type f || true
            exit 1
          fi
          (cd release-assets && sha256sum avo-*.zip > SHA256SUMS)
          cat release-assets/SHA256SUMS
          gh release upload "$TAG" \
            release-assets/avo-"${VERSION}"-windows-x64.zip \
            release-assets/avo-"${VERSION}"-macos-arm64.zip \
            release-assets/avo-"${VERSION}"-linux-x64.zip \
            release-assets/SHA256SUMS \
            --clobber \
            --repo "${{ github.repository }}"
          gh release edit "$TAG" --draft=false --repo "${{ github.repository }}"
