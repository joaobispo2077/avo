name: CI

on:
  push:
    branches:
      - main
      - develop
      - release
      - 'feature/**'
  pull_request:
    branches:
      - main
      - release

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '24'
  AVO_CI: '1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  prerequisites-gate:
    name: Gate 1 — Orchestrator prerequisites
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Run Gate 1
        run: bash scripts/validate-prerequisites.sh --ci

  repo-unit-tests:
    name: Unit tests (AVO repo)
    runs-on: ubuntu-latest
    needs: prerequisites-gate
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync Python deps (frozen)
        run: uv sync --frozen --extra dev

      - name: Expose venv on PATH
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run unit tests
        run: bash scripts/ci/run-unit-tests.sh

      - name: Install script dry-run smoke
        run: bash scripts/ci/install-smoke.sh

      - name: HyperFrames doctor
        run: npm run hf:doctor

      - name: Lint HyperFrames exemplars
        run: bash scripts/ci/lint-hyperframes-exemplars.sh

  software-quality:
    # GitHub check name for branch protection: "Software quality"
    # Phase-1 Must Have fast gates (task-013) — blocking on PR/push via needs into Gate 2.
    name: Software quality
    runs-on: ubuntu-latest
    needs: prerequisites-gate
    permissions:
      contents: read
      pull-requests: write
    # Coverage re-runs the full unit suite (~few min) plus lint/format/complexity/deps.
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync Python deps (frozen)
        run: uv sync --frozen --extra dev

      - name: Expose venv on PATH
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # Spec v1.4 / task-013: Phase-1 fast gates — all fail-immediately (no soft stubs).
      # Umbrella scripts match local `npm run quality` / scripts/ci/quality.sh.
      - name: Software quality — lint
        id: q-lint
        run: bash scripts/ci/quality-lint.sh

      - name: Software quality — format
        id: q-format
        run: bash scripts/ci/quality-format.sh

      - name: Software quality — coverage
        id: q-coverage
        run: bash scripts/ci/run-coverage.sh

      - name: Software quality — complexity
        id: q-complexity
        run: bash scripts/ci/quality-complexity.sh

      - name: Software quality — deps
        id: q-deps
        run: bash scripts/ci/quality-deps.sh

      - name: Software quality — deadcode
        id: q-deadcode
        run: bash scripts/ci/quality-deadcode.sh

      - name: Software quality — duplication
        id: q-duplication
        run: bash scripts/ci/quality-duplication.sh

      - name: Software quality — architecture
        id: q-architecture
        run: bash scripts/ci/quality-architecture.sh

      - name: Software quality — tree
        id: q-tree
        run: bash scripts/ci/quality-tree.sh

      - name: Build quality PR report
        if: always()
        env:
          Q_LINT: ${{ steps.q-lint.outcome }}
          Q_FORMAT: ${{ steps.q-format.outcome }}
          Q_COVERAGE: ${{ steps.q-coverage.outcome }}
          Q_COMPLEXITY: ${{ steps.q-complexity.outcome }}
          Q_DEPS: ${{ steps.q-deps.outcome }}
          Q_DEADCODE: ${{ steps.q-deadcode.outcome }}
          Q_DUPLICATION: ${{ steps.q-duplication.outcome }}
          Q_ARCHITECTURE: ${{ steps.q-architecture.outcome }}
          Q_TREE: ${{ steps.q-tree.outcome }}
        run: python scripts/ci/write_quality_pr_report.py --out reports/quality/quality-gates.md

      - name: Resolve PR number
        if: always()
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            NUM="$(gh pr list --repo "${{ github.repository }}" --head "${{ github.ref_name }}" --state open --json number --jq '.[0].number // empty')"
            echo "number=${NUM}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish quality summary to PR
        if: always() && steps.pr.outputs.number != ''
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          number: ${{ steps.pr.outputs.number }}
          path: reports/quality/quality-gates.md
          header: quality-gates-report
          recreate: true

  usability-gate:
    name: Gate 2 — Project usability
    runs-on: ubuntu-latest
    # Blocks merge readiness when Software quality fails (required check below).
    needs: [prerequisites-gate, repo-unit-tests, software-quality]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python package
        run: pip install -e .

      - name: Run Gate 2
        run: bash scripts/validate-usability.sh --ci

  mutation-light:
    # Spec FR-7: light/PR mutation after unit tests. Ubuntu-only. Fails below
    # scripts/ci/mutation-config.json light floor. Not part of Software quality
    # fast gates (coverage already re-runs pytest). 20m SLA (ci-quality-hardening).
    name: Mutation tests (light)
    runs-on: ubuntu-latest
    needs: [prerequisites-gate, repo-unit-tests]
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync Python deps (frozen)
        run: uv sync --frozen --extra dev

      - name: Expose venv on PATH
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Cache mutmut light results
        uses: actions/cache@v5
        with:
          path: mutants
          key: mutmut-light-${{ hashFiles('uv.lock', 'pyproject.toml', 'scripts/ci/mutation-config.json') }}-${{ github.ref }}
          restore-keys: |
            mutmut-light-${{ hashFiles('uv.lock', 'pyproject.toml', 'scripts/ci/mutation-config.json') }}-

      - name: Run light mutation
        env:
          AVO_MUTATION_PROFILE: light
        run: bash scripts/ci/run-mutation-light.sh

      - name: Upload light mutation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-reports-light
          path: reports/mutation
          if-no-files-found: warn
          retention-days: 14

      - name: Build mutation PR report
        if: always()
        env:
          AVO_MUTATION_PROFILE: light
        run: python scripts/ci/write_mutation_pr_report.py --out reports/mutation/mutation-report.md

      - name: Resolve PR number
        if: always()
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            NUM="$(gh pr list --repo "${{ github.repository }}" --head "${{ github.ref_name }}" --state open --json number --jq '.[0].number // empty')"
            echo "number=${NUM}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish mutation summary to PR
        if: always() && steps.pr.outputs.number != ''
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          number: ${{ steps.pr.outputs.number }}
          path: reports/mutation/mutation-report.md
          header: mutation-report
          recreate: true
