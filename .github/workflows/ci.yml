name: CI

on:
  push:
    branches:
      - main
      - develop
      - release
      - 'feature/**'
  pull_request:
    branches:
      - main
      - release

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'
  AVO_CI: '1'

jobs:
  prerequisites-gate:
    name: Gate 1 — Orchestrator prerequisites
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Run Gate 1
        run: bash scripts/validate-prerequisites.sh --ci

  repo-unit-tests:
    name: Unit tests (AVO repo)
    runs-on: ubuntu-latest
    needs: prerequisites-gate
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Python package
        run: pip install -e ".[dev]"

      - name: Install Node dependencies
        run: npm ci

      - name: Run unit tests
        run: bash scripts/ci/run-unit-tests.sh

      - name: Install script dry-run smoke
        run: bash scripts/ci/install-smoke.sh

      - name: HyperFrames doctor
        run: npm run hf:doctor

  usability-gate:
    name: Gate 2 — Project usability
    runs-on: ubuntu-latest
    needs: [prerequisites-gate, repo-unit-tests]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python package
        run: pip install -e .

      - name: Run Gate 2
        run: bash scripts/validate-usability.sh --ci
