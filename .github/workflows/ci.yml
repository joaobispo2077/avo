name: CI

on:
  push:
    branches:
      - main
      - develop
      - release
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop
      - release

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '24'
  AVO_CI: '1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  prerequisites-gate:
    name: Gate 1 — Orchestrator prerequisites
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Run Gate 1
        run: bash scripts/validate-prerequisites.sh --ci

  repo-unit-tests:
    name: Unit tests (AVO repo)
    runs-on: ubuntu-24.04
    needs: prerequisites-gate
    timeout-minutes: 12
    outputs:
      evidence_url: ${{ steps.unit-evidence.outputs.artifact-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Sync Python deps (frozen)
        run: uv sync --frozen --extra dev

      - name: Expose venv on PATH
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install ffmpeg
        timeout-minutes: 3
        run: bash scripts/ci/ensure-ffmpeg.sh

      - name: Run unit tests
        env:
          PYTEST_ADDOPTS: --junitxml=reports/quality/unit-tests.xml
        run: python scripts/ci/run_quality_gate.py --gate unit-tests --artifact reports/quality/unit-tests.xml -- bash scripts/ci/run-unit-tests.sh

      - name: Upload unit execution evidence
        id: unit-evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-evidence
          overwrite: true
          path: reports/quality
          if-no-files-found: warn
          retention-days: 14

      - name: Install script dry-run smoke
        run: bash scripts/ci/install-smoke.sh

      - name: HyperFrames doctor
        run: npm run hf:doctor

      - name: Lint HyperFrames exemplars
        run: bash scripts/ci/lint-hyperframes-exemplars.sh

  repo-integration-tests:
    name: Integration tests (AVO repo)
    runs-on: ubuntu-24.04
    needs: prerequisites-gate
    timeout-minutes: 20
    outputs:
      evidence_url: ${{ steps.integration-evidence.outputs.artifact-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Sync Python deps (frozen)
        run: uv sync --frozen --extra dev --extra mcp

      - name: Expose venv on PATH
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install ffmpeg
        timeout-minutes: 3
        run: bash scripts/ci/ensure-ffmpeg.sh

      - name: Run integration tests
        env:
          PYTEST_ADDOPTS: --junitxml=reports/quality/integration-tests.xml
        run: python scripts/ci/run_quality_gate.py --gate integration-tests --artifact reports/quality/integration-tests.xml -- bash scripts/ci/run-integration-tests.sh

      - name: Upload integration execution evidence
        id: integration-evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-evidence
          overwrite: true
          path: reports/quality
          if-no-files-found: warn
          retention-days: 14

  software-quality:
    # GitHub check name for branch protection: "Software quality"
    # Phase-1 Must Have fast gates (task-013) — blocking on PR/push via needs into Gate 2.
    name: Software quality
    runs-on: ubuntu-24.04
    needs: prerequisites-gate
    permissions:
      contents: read
    # Coverage re-runs the unit suite only (tests/integration has its own job).
    timeout-minutes: 35
    outputs:
      evidence_url: ${{ steps.quality-evidence.outputs.artifact-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Sync Python deps (frozen)
        run: uv sync --frozen --extra dev --extra mcp

      - name: Expose venv on PATH
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install ffmpeg
        timeout-minutes: 3
        run: bash scripts/ci/ensure-ffmpeg.sh

      # Spec v1.4 / task-013: Phase-1 fast gates — all fail-immediately (no soft stubs).
      # Umbrella scripts match local `npm run quality` / scripts/ci/quality.sh.
      - name: Software quality — lint
        id: q-lint
        run: python scripts/ci/run_quality_gate.py --gate lint -- bash scripts/ci/quality-lint.sh

      - name: Software quality — format
        id: q-format
        run: python scripts/ci/run_quality_gate.py --gate format -- bash scripts/ci/quality-format.sh

      - name: Software quality — coverage
        id: q-coverage
        run: python scripts/ci/run_quality_gate.py --gate coverage --artifact reports/quality/coverage.json -- bash scripts/ci/run-coverage.sh

      - name: Software quality — complexity
        id: q-complexity
        run: python scripts/ci/run_quality_gate.py --gate complexity --artifact reports/quality/complexity.json -- bash scripts/ci/quality-complexity.sh

      - name: Software quality — deps
        id: q-deps
        run: python scripts/ci/run_quality_gate.py --gate deps --artifact reports/quality/deps-findings.json --artifact reports/quality/npm-audit-summary.json --artifact reports/quality/pip-audit-raw.json --artifact reports/quality/npm-audit-raw.json -- bash scripts/ci/quality-deps.sh

      - name: Software quality — deadcode
        id: q-deadcode
        run: python scripts/ci/run_quality_gate.py --gate deadcode --artifact reports/quality/deadcode.json -- bash scripts/ci/quality-deadcode.sh

      - name: Software quality — duplication
        id: q-duplication
        run: python scripts/ci/run_quality_gate.py --gate duplication --artifact reports/quality/jscpd/jscpd-report.json -- bash scripts/ci/quality-duplication.sh

      - name: Software quality — architecture
        id: q-architecture
        run: python scripts/ci/run_quality_gate.py --gate architecture -- bash scripts/ci/quality-architecture.sh

      - name: Software quality — tree
        id: q-tree
        run: python scripts/ci/run_quality_gate.py --gate tree --artifact reports/quality/dependency-tree.json --artifact reports/quality/dependency-tree-raw.log -- bash scripts/ci/quality-tree.sh

      - name: Measure function risk and coupling
        if: always()
        continue-on-error: true
        run: |
          python scripts/ci/run_quality_gate.py --gate code-risk --artifact reports/quality/code-risk.json -- \
            python scripts/ci/measure_code_risk.py \
            --coverage-receipt reports/quality/gates/coverage/gate.json \
            --test-outcome '${{ steps.q-coverage.outcome }}'

      - name: Build quality PR report
        if: always()
        env:
          Q_LINT: ${{ steps.q-lint.outcome }}
          Q_FORMAT: ${{ steps.q-format.outcome }}
          Q_COVERAGE: ${{ steps.q-coverage.outcome }}
          Q_COMPLEXITY: ${{ steps.q-complexity.outcome }}
          Q_DEPS: ${{ steps.q-deps.outcome }}
          Q_DEADCODE: ${{ steps.q-deadcode.outcome }}
          Q_DUPLICATION: ${{ steps.q-duplication.outcome }}
          Q_ARCHITECTURE: ${{ steps.q-architecture.outcome }}
          Q_TREE: ${{ steps.q-tree.outcome }}
        run: |
          python scripts/ci/write_quality_metrics_snapshot.py \
            --write-json reports/quality/quality-metrics.json \
            --coverage reports/quality/coverage.json

      - name: Upload quality evidence
        id: quality-evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-evidence
          overwrite: true
          path: reports/quality
          if-no-files-found: warn
          retention-days: 14

  usability-gate:
    name: Gate 2 — Project usability
    runs-on: ubuntu-24.04
    # Blocks merge readiness when Software quality fails (required check below).
    needs: [prerequisites-gate, repo-unit-tests, repo-integration-tests, software-quality]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python package
        run: pip install -e .

      - name: Run Gate 2
        run: bash scripts/validate-usability.sh --ci

  mutation-light:
    # Spec FR-7: light/PR mutation after unit tests. Ubuntu-only. Fails below
    # scripts/ci/mutation-config.json light floor. Not part of Software quality
    # fast gates (coverage already re-runs pytest). 20m SLA (ci-quality-hardening).
    name: Mutation tests (light)
    runs-on: ubuntu-24.04
    needs: [prerequisites-gate, repo-unit-tests]
    timeout-minutes: 20
    outputs:
      evidence_url: ${{ steps.mutation-evidence.outputs.artifact-url }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Sync Python deps (frozen)
        run: uv sync --frozen --extra dev

      - name: Expose venv on PATH
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Cache mutmut light results
        uses: actions/cache@v5
        with:
          path: mutants
          key: mutmut-light-${{ hashFiles('uv.lock', 'pyproject.toml', 'scripts/ci/mutation-config.json') }}-${{ github.ref }}
          restore-keys: |
            mutmut-light-${{ hashFiles('uv.lock', 'pyproject.toml', 'scripts/ci/mutation-config.json') }}-

      - name: Run light mutation
        env:
          AVO_MUTATION_PROFILE: light
        run: bash scripts/ci/run-mutation-light.sh

      - name: Build mutation PR report
        if: always()
        env:
          AVO_MUTATION_PROFILE: light
        run: python scripts/ci/write_mutation_pr_report.py --out reports/mutation/mutation-report.md

      - name: Upload light mutation reports
        id: mutation-evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-reports-light
          overwrite: true
          path: reports/mutation
          if-no-files-found: warn
          retention-days: 14


  ci-readiness:
    name: CI readiness
    if: always()
    needs:
      - prerequisites-gate
      - repo-unit-tests
      - repo-integration-tests
      - software-quality
      - usability-gate
      - mutation-light
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Require successful mandatory jobs
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: python scripts/ci/check_ci_readiness.py

  quality-report:
    name: Quality report
    if: always()
    needs: [prerequisites-gate, repo-unit-tests, repo-integration-tests, software-quality, usability-gate, mutation-light, ci-readiness]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install dashboard runtime
        continue-on-error: true
        run: uv sync --frozen

      - name: Download quality evidence
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: quality-evidence
          path: reports/quality/evidence

      - name: Download mutation evidence
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: mutation-reports-light
          path: reports/mutation/evidence

      - name: Download unit execution evidence
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: unit-test-evidence
          path: reports/quality/unit-evidence

      - name: Download integration execution evidence
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: integration-test-evidence
          path: reports/quality/integration-evidence

      - name: Build unified quality report
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          PY=python
          if [ -x .venv/bin/python ]; then PY=.venv/bin/python; fi
          "$PY" scripts/ci/write_unified_quality_report.py
          cp reports/quality/quality-gates.md reports/quality/quality-gates-base.md

      - name: Upload unified metrics
        id: quality_metrics
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: quality-metrics
          overwrite: true
          path: reports/quality/quality-metrics.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload dashboard image
        id: quality_charts
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: quality-metrics-charts
          overwrite: true
          path: reports/quality/charts/dashboard.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Resolve PR number
        id: pr
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          NUM="$PR_NUMBER"
          if [ -z "$NUM" ]; then
            NUM="$(gh pr list --head "$HEAD_BRANCH" --state open --json number --jq '.[0].number // empty')"
          fi
          echo "number=${NUM}" >> "$GITHUB_OUTPUT"

      - name: Attach inline quality dashboard
        continue-on-error: true
        # User credentials are never exposed to a fork's pull request code.
        if: steps.pr.outputs.number != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          QUALITY_CHARTS_TOKEN: ${{ secrets.QUALITY_CHARTS_TOKEN }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          PY=python
          if [ -x .venv/bin/python ]; then PY=.venv/bin/python; fi
          "$PY" scripts/ci/upload_quality_chart.py

      - name: Link quality chart and artifact downloads
        env:
          QUALITY_METRICS_ARTIFACT_URL: ${{ steps.quality_metrics.outputs.artifact-url }}
          QUALITY_CHARTS_ARTIFACT_URL: ${{ steps.quality_charts.outputs.artifact-url }}
        run: python scripts/ci/link_quality_artifacts.py --markdown reports/quality/quality-gates.md --attachment reports/quality/chart-attachment.json --no-summary

      - name: Publish quality summary to PR
        id: quality_comment
        if: steps.pr.outputs.number != ''
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          number: ${{ steps.pr.outputs.number }}
          path: reports/quality/quality-gates.md
          header: quality-gates-report

      - name: Publish unified job summary
        env:
          COMMENT_RESULT: ${{ steps.quality_comment.outcome }}
          QUALITY_METRICS_ARTIFACT_URL: ${{ steps.quality_metrics.outputs.artifact-url }}
          QUALITY_CHARTS_ARTIFACT_URL: ${{ steps.quality_charts.outputs.artifact-url }}
        run: |
          # Native attachments become readable when associated with a comment.
          if [ "$COMMENT_RESULT" != "success" ]; then
            cp reports/quality/quality-gates-base.md reports/quality/quality-gates.md
            python scripts/ci/link_quality_artifacts.py --markdown reports/quality/quality-gates.md --no-summary
          fi
          cat reports/quality/quality-gates.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload readable quality report
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: quality-report
          overwrite: true
          path: reports/quality/quality-gates.md
          retention-days: 14

      - name: Remove superseded mutation comment
        if: steps.pr.outputs.number != ''
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          number: ${{ steps.pr.outputs.number }}
          header: mutation-report
          delete: true
