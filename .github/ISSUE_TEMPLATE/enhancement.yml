name: Enhancement
description: New capability, slash command, or roadmap item
title: "[Enhancement]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem and acceptance criteria. Large features may need Spec Kit or SDD specs in the repo.
  - type: textarea
    id: user-story
    attributes:
      label: User story
      placeholder: As a … I want … so that …
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true
  - type: input
    id: slash-surface
    attributes:
      label: Proposed slash command (if any)
      placeholder: /avo.organize
  - type: checkboxes
    id: sponsor
    attributes:
      label: Sponsor interest (optional)
      options:
        - label: I would sponsor or fund this item to move it up the queue
          required: false
        - label: I am already a GitHub Sponsor or Buy Me a Coffee supporter
          required: false
