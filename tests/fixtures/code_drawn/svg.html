<!doctype html>
<meta charset="utf-8">
<style>html,body{margin:0;overflow:hidden}#avo-stage{display:block;width:128px;height:96px}</style>
<svg id="avo-stage" xmlns="http://www.w3.org/2000/svg" width="128" height="96" viewBox="0 0 128 96">
  <rect id="background" width="128" height="96" fill="none"/>
  <rect id="moving" x="8" y="22" width="18" height="22" fill="#e04444"/>
  <circle cx="93" cy="60" r="15" fill="#3060e0" fill-opacity="0.5"/>
</svg>
<script>
const background = __AVO_TEST_BACKGROUND__;
document.getElementById("background").setAttribute("fill", background || "none");
window.avoReady = Promise.resolve();
window.seek = async (t) => {
  await Promise.resolve();
  const frame = Math.floor(t * 30000 / 1001 + 0.5);
  const moving = document.getElementById("moving");
  moving.setAttribute("x", String(8 + frame % 12 * 3));
  moving.setAttribute("fill", frame < 6 ? "#e04444" : "#22bbcc");
};
</script>
